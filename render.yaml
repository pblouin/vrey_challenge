databases:
  - name: vrey-challenge-db
    databaseName: vrey_challenge
    user: vrey_challenge
    plan: free
    region: frankfurt

services:
  - type: web
    name: vrey-challenge
    runtime: ruby
    plan: free
    region: frankfurt
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vrey-challenge-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
